[mypy]
check_untyped_defs = True
disallow_any_generics = True
disallow_untyped_calls = True
disallow_untyped_defs = True
ignore_missing_imports = True
no_implicit_optional = True
warn_unused_ignores = True
enable_error_code = ignore-without-code

[mypy-superset.migrations.versions.*]
ignore_errors = True

[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False
disable_error_code = annotation-unchecked

[mypy-cryptography.*]
ignore_errors = True
follow_imports = skip

[mypy-superset_core.*]
follow_imports = skip

[mypy-superset.core.api.core_api_injection,superset.security.manager,superset.daos.base,superset.connectors.sqla.models,superset.tags.filters,superset.commands.security.update,superset.commands.security.create,superset.semantic_layers.api]
warn_unused_ignores = False
